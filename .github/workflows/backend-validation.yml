name: Backend Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser runtime JavaScript syntax
        run: node --check backend/supabase-runtime.js
      - name: Check inline application JavaScript and quotation layout rules
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs]) => !/\bsrc\s*=/.test(attrs))
            .map(([, , body]) => body.trim()).filter(Boolean);
          if (!scripts.length) throw new Error('No inline application scripts found');
          scripts.forEach((source, index) => {
            try { new Function(source); }
            catch (error) { console.error('Inline script ' + (index + 1) + ' failed syntax check'); throw error; }
          });
          const discountRows = (html.match(/class="charge-row discount-charge"/g) || []).length;
          if (discountRows !== 2) throw new Error('Quotation must contain exactly two fixed discount rows; found ' + discountRows);
          if (/TOTAL DISCOUNTS|TOTAL DISCOUNT<\/td>/i.test(html)) throw new Error('Aggregate Total Discount label must not appear in the quotation layout');
          console.log('Inline scripts valid; exactly two discount rows; no aggregate discount row.');
          NODE
      - name: Check Price List module JavaScript syntax
        run: node --check backend/price-list-module.js
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/employee-admin/index.ts
