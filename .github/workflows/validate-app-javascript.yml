name: Validate app JavaScript

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.parts = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = any(k.lower() == "src" for k, _ in attrs)
                      self.parts = []

              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external:
                          code = "".join(self.parts).strip()
                          if code:
                              self.scripts.append(code)
                      self.in_script = False
                      self.external = False
                      self.parts = []

          html = Path("index.html").read_text(encoding="utf-8")
          parser = ScriptExtractor()
          parser.feed(html)
          for i, code in enumerate(parser.scripts, 1):
              Path(f"/tmp/inline-{i}.js").write_text(code, encoding="utf-8")
          print(f"Extracted {len(parser.scripts)} inline JavaScript block(s).")
          PY
          for file in /tmp/inline-*.js; do
            [ -e "$file" ] || continue
            echo "Checking $file"
            node --check "$file"
          done
          node --check backend/supabase-runtime.js
          node --check backend/price-list-module.js
