name: Deploy Stock Management to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser runtime
        run: |
          node --check backend/supabase-runtime.js
          node --check backend/price-list-module.js
      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p _site/backend _site/icons
          cp index.html manifest.webmanifest service-worker.js _site/
          cp backend/supabase-runtime.js backend/price-list-module.js _site/backend/
          cp icons/* _site/icons/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
